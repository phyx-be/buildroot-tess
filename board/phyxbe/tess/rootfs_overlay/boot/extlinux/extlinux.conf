label TESS
    kernel /boot/zImage
    devicetree /boot/sun8i-t113s-tess.dtb
    # Raspberry Pi 7" DSI display; remove this line when it is not connected
    fdtoverlays /boot/rpi-7inch-dsi.dtbo
    append console=tty0 console=ttyS3,115200 root=/dev/mmcblk0p1 rootwait panic=10 fbcon=rotate:1 ${extra}
