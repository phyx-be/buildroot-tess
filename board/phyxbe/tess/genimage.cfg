# Tess SD NAND (480 MiB)
#
#   8 KiB  U-Boot with SPL (the T113 boot ROM loads it from 8 KiB)
#   1 MiB  U-Boot environment, two redundant copies of 64 KiB (written by
#          U-Boot on the first boot, see uboot/tess-main.fragment)
#   4 MiB  mmcblk0p1: root filesystem slot A, read-only
# 100 MiB  mmcblk0p2: root filesystem slot B, read-only
# 196 MiB  mmcblk0p3: data, read-write, the rest of the SD NAND, no
#          filesystem in the image: tess-install or /etc/init.d/S00datafs
#          creates it
#
# Both slots get the same root filesystem, so slot B is a valid fallback
# until the first RAUC update.

image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K # 1MB - 8KB
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
		offset = 4M
		size = 96M
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 96M
	}

	partition data {
		partition-type = 0x83
		size = 284M
	}
}
